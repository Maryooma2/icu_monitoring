<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="600" y="30" text-anchor="middle" font-size="20" font-weight="600" fill="#222">ICU Monitoring Platform — End-to-End Architecture</text>

  <!-- Docker boundary -->
  <rect x="20" y="48" width="1160" height="530" rx="12" fill="none" stroke="#999" stroke-dasharray="6 5"/>
  <text x="34" y="66" font-size="12" fill="#777">Docker Compose (local environment)</text>

  <!-- Airflow band -->
  <rect x="40" y="76" width="1120" height="100" rx="10" fill="#e9f7ee" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="56" y="97" font-size="14" font-weight="600" fill="#1e6b30">Apache Airflow — DAG icu_monitoring_pipeline</text>
  <text x="1144" y="97" text-anchor="end" font-size="11" fill="#1e6b30">every 15 min · retries ×2 with backoff · on_failure_callback → alert webhook</text>

  <g font-size="12" text-anchor="middle" fill="#222">
    <rect x="60"  y="112" width="190" height="40" rx="8" fill="#fff" stroke="#2f9e44"/><text x="155"  y="136">produce_events</text>
    <rect x="272" y="112" width="190" height="40" rx="8" fill="#fff" stroke="#2f9e44"/><text x="367"  y="136">bronze_ingestion</text>
    <rect x="484" y="112" width="190" height="40" rx="8" fill="#fff" stroke="#2f9e44"/><text x="579"  y="136">silver_transformation</text>
    <rect x="696" y="112" width="190" height="40" rx="8" fill="#fff" stroke="#2f9e44"/><text x="791"  y="136">gold_aggregation</text>
    <rect x="908" y="112" width="232" height="40" rx="8" fill="#fff" stroke="#2f9e44"/><text x="1024" y="136">check_critical_patients</text>
  </g>
  <g stroke="#2f9e44" stroke-width="1.5" fill="none" marker-end="url(#arrow-dash)">
    <line x1="250" y1="132" x2="272" y2="132"/>
    <line x1="462" y1="132" x2="484" y2="132"/>
    <line x1="674" y1="132" x2="696" y2="132"/>
    <line x1="886" y1="132" x2="908" y2="132"/>
  </g>

  <!-- orchestration drop lines -->
  <g stroke="#2f9e44" stroke-width="1.2" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow-dash)">
    <line x1="155"  y1="152" x2="255" y2="248"/>
    <line x1="367"  y1="152" x2="445" y2="248"/>
    <line x1="579"  y1="152" x2="665" y2="248"/>
    <line x1="791"  y1="152" x2="890" y2="248"/>
    <line x1="1024" y1="152" x2="1085" y2="248"/>
  </g>

  <!-- Data flow boxes -->
  <!-- Source -->
  <rect x="40" y="250" width="120" height="170" rx="10" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#222">
    <text x="100" y="278" font-size="13" font-weight="600">ICU monitors</text>
    <text x="100" y="302" font-size="11">(simulated:</text>
    <text x="100" y="318" font-size="11">generator / CSV)</text>
    <text x="100" y="346" font-size="11">heart rate</text>
    <text x="100" y="362" font-size="11">SpO₂</text>
    <text x="100" y="378" font-size="11">temperature</text>
  </g>

  <!-- Kafka -->
  <rect x="190" y="250" width="130" height="170" rx="10" fill="#e8eefb" stroke="#3b5bdb" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#222">
    <text x="255" y="278" font-size="13" font-weight="600">Apache Kafka</text>
    <text x="255" y="302" font-size="11">topic:</text>
    <text x="255" y="318" font-size="11">patient_vitals</text>
    <text x="255" y="346" font-size="11">key = patient_id</text>
    <text x="255" y="362" font-size="11">idempotent</text>
    <text x="255" y="378" font-size="11">producer</text>
  </g>

  <!-- Bronze -->
  <rect x="360" y="250" width="170" height="170" rx="10" fill="#f8e6d3" stroke="#b87333" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#222">
    <text x="445" y="278" font-size="13" font-weight="600">BRONZE</text>
    <text x="445" y="298" font-size="11">Delta · append-only</text>
    <text x="445" y="322" font-size="11">raw payload + offsets</text>
    <text x="445" y="338" font-size="11">is_parse_ok flag</text>
    <text x="445" y="354" font-size="11">partition: ingest_date</text>
    <text x="445" y="386" font-size="11" fill="#7a4a1d">Spark Structured</text>
    <text x="445" y="400" font-size="11" fill="#7a4a1d">Streaming (availableNow)</text>
  </g>

  <!-- Silver -->
  <rect x="570" y="250" width="190" height="170" rx="10" fill="#e8ebf0" stroke="#7b8598" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#222">
    <text x="665" y="278" font-size="13" font-weight="600">SILVER</text>
    <text x="665" y="298" font-size="11">Delta · batch · MERGE</text>
    <text x="665" y="322" font-size="11">dedup · range checks</text>
    <text x="665" y="338" font-size="11">°F → °C · quarantine</text>
    <text x="665" y="362" font-size="11">fact_patient_vitals</text>
    <text x="665" y="378" font-size="11">dim_patient · dim_device</text>
    <text x="665" y="394" font-size="11">quarantine_vitals</text>
  </g>

  <!-- Gold -->
  <rect x="800" y="250" width="180" height="170" rx="10" fill="#fcf2c7" stroke="#c9a227" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#222">
    <text x="890" y="278" font-size="13" font-weight="600">GOLD</text>
    <text x="890" y="298" font-size="11">Delta · batch</text>
    <text x="890" y="322" font-size="11">early warning score</text>
    <text x="890" y="338" font-size="11">Stable / Warning / Critical</text>
    <text x="890" y="362" font-size="11">vitals_scored</text>
    <text x="890" y="378" font-size="11">current_status</text>
    <text x="890" y="394" font-size="11">daily_kpi · critical_summary</text>
  </g>

  <!-- Outputs -->
  <rect x="1010" y="250" width="150" height="80" rx="10" fill="#f3e8fd" stroke="#7048e8" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#222">
    <text x="1085" y="274" font-size="13" font-weight="600">Alerts</text>
    <text x="1085" y="294" font-size="11">Slack / Power Automate</text>
    <text x="1085" y="310" font-size="11">Critical patients ·</text>
    <text x="1085" y="324" font-size="11">silent devices · failures</text>
  </g>
  <rect x="1010" y="345" width="150" height="75" rx="10" fill="#f3e8fd" stroke="#7048e8" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#222">
    <text x="1085" y="369" font-size="13" font-weight="600">Dashboard</text>
    <text x="1085" y="389" font-size="11">Power BI / Looker Studio</text>
    <text x="1085" y="405" font-size="11">via exported CSV</text>
  </g>

  <!-- Data flow arrows -->
  <g stroke="#333" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <line x1="160" y1="335" x2="190" y2="335"/>
    <line x1="320" y1="335" x2="360" y2="335"/>
    <line x1="530" y1="335" x2="570" y2="335"/>
    <line x1="760" y1="335" x2="800" y2="335"/>
    <line x1="980" y1="320" x2="1010" y2="295"/>
    <line x1="980" y1="350" x2="1010" y2="380"/>
  </g>

  <!-- Storage band -->
  <rect x="360" y="440" width="620" height="40" rx="8" fill="#f7f7f7" stroke="#aaa"/>
  <text x="670" y="465" text-anchor="middle" font-size="12" fill="#444">Delta Lake tables on the shared workspace volume (workspace/delta) · checkpoints · logs</text>
  <g stroke="#aaa" stroke-width="1" stroke-dasharray="3 3">
    <line x1="445" y1="420" x2="445" y2="440"/>
    <line x1="665" y1="420" x2="665" y2="440"/>
    <line x1="890" y1="420" x2="890" y2="440"/>
  </g>

  <!-- Containers -->
  <g font-size="12" fill="#444">
    <text x="40" y="520" font-weight="600">Containers:</text>
    <text x="115" y="520">airflow (Java 17 + Spark 3.5 + papermill runs the notebooks) · kafka + zookeeper · jupyter/pyspark (development)</text>
  </g>

  <!-- Legend -->
  <g font-size="11" fill="#444">
    <line x1="40" y1="548" x2="80" y2="548" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="90" y="552">data flow</text>
    <line x1="180" y1="548" x2="220" y2="548" stroke="#2f9e44" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow-dash)"/>
    <text x="230" y="552">orchestration (Airflow runs the step)</text>
  </g>
</svg>
